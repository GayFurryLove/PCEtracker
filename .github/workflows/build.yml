name: build

on:
  push:
  pull_request:

jobs:
  linux-i386:
    # 32-bit x86 build (i686, no SSE2 requirement) with gcc-multilib.
    # The x86_64 kernel runs the 32-bit test binaries natively.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install 32-bit toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends gcc-multilib g++-multilib
      - name: Configure
        run: cmake -S . -B build-i386 -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE=cmake/toolchain-linux-i386.cmake
      - name: Build
        run: cmake --build build-i386 -j2
      - name: Check binary is 32-bit
        run: file build-i386/test_psg build-i386/psg_demo | tee /dev/stderr | grep -qE "ELF 32-bit LSB.*Intel (80386|i386)"
      - name: Test
        run: ctest --test-dir build-i386 --output-on-failure

  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
